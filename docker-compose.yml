version: '3'

services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:

    build: ./backend

    ports:
      - "5000:5000"

    environment:
      DB_HOST: postgres
      DB_NAME: attendance
      DB_USER: postgres
      DB_PASSWORD: password

    depends_on:
      - postgres

  frontend:

    build: ./frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend